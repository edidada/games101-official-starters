name: GAMES101 HW6 BVH and SAH
on:
  push:
    branches: [edidada/hw6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceleration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/verify-hw6.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw6-evidence
          path: evidence/
