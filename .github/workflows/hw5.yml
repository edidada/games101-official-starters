name: GAMES101 HW5 primary rays and triangles
on:
  push:
    branches: [edidada/hw5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rays:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/verify-hw5.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-evidence
          path: evidence/
