name: GAMES101 HW8 rope simulation
on:
  push:
    branches: [edidada/hw8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/verify-hw8.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw8-evidence
          path: evidence/
