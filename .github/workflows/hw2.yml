name: GAMES101 HW2 rasterization and supersampling
on:
  push:
    branches: [edidada/hw2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rasterizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libopencv-dev python3-opencv
      - run: bash ci/verify-hw2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw2-evidence
          path: evidence/
