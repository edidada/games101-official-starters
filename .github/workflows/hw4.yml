name: GAMES101 HW4 Bezier curves
on:
  push:
    branches: [edidada/hw4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bezier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev python3-opencv xvfb xdotool imagemagick
      - run: bash ci/verify-hw4.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw4-evidence
          path: evidence/
